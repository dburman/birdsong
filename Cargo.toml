[workspace]
resolver = "2"
members = ["crates/birdsong-model"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
tract-onnx = "0.23"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
