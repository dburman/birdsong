# Birdsong on a Raspberry Pi. See docs/RASPBERRY_PI.md.
#
#   mkdir -p data config && sudo chown 1000:1000 data
#   cp config/birdsong.example.toml config/birdsong.toml   # then edit it
#   scripts/fetch-models.sh                               # once, on any machine with Docker
#   docker compose up -d

services:
  birdsong:
    build: .
    image: birdsong:latest
    container_name: birdsong
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - /dev/snd:/dev/snd        # USB microphone / sound card
    group_add:
      - audio
    volumes:
      - ./config:/config:ro
      - ./models:/models:ro
      - ./data:/data             # database and clips; must be writable by uid 1000
    stop_grace_period: 20s       # queued chunks are analysed and stored before exit
    healthcheck:
      test: ["CMD", "birdsong", "healthcheck", "--url", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
