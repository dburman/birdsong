# Birdsong configuration. Copy to config/birdsong.toml and edit.
# Every key can be overridden with BIRDSONG__SECTION__KEY, e.g. BIRDSONG__DETECTION__MIN_CONFIDENCE=0.8

[station]
name = "Backyard"
latitude = 42.36            # set both to 0 to disable the location filter
longitude = -71.06
timezone = "America/New_York"   # IANA name; used for daily charts and clip folder dates

[audio]
ffmpeg_path = "ffmpeg"          # capture uses ffmpeg (>= 5.0) for ALSA devices, streams and files
ring_buffer_seconds = 90.0      # recent audio kept per source for cutting clips

# One or more audio sources; each becomes an independent capture task.
[[audio.sources]]
id = "mic0"
kind = "alsa"               # "alsa" | "rtsp" | "file"
device = "plughw:CARD=Device,DEV=0"  # list yours with `birdsong devices`; card numbers (hw:1,0) can change between boots
# url = "rtsp://user:pass@camera/stream"   # for kind = "rtsp"
# path = "/data/test.wav"                  # for kind = "file" (replays the file, for testing)
gain_db = 0.0

[detection]
min_confidence = 0.7            # BirdNET-Pi CONFIDENCE
sensitivity = 1.25              # BirdNET-Pi SENSITIVITY, 0.5..=1.5
overlap_seconds = 0.0           # BirdNET-Pi OVERLAP, 0.0..<3.0
species_filter_threshold = 0.03 # location filter threshold (BirdNET SF_THRESH)
top_n_per_chunk = 3             # classes per 3 s window that may become detections
include_species = []            # scientific names always allowed, e.g. ["Cardinalis cardinalis"]
exclude_species = []            # scientific names never reported
privacy_filter = true           # BirdNET-Pi human-voice mask
privacy_threshold = 0.0         # percent 0..100; higher is stricter

# Optional detection-quality filters, both off by default (BirdNET-Pi behaviour).
min_detections = 1              # hits of a species needed before any are stored; 2 with overlap cuts one-off false positives
confirmation_window_seconds = 15.0
confirmation_exempt_species = []  # stored without confirmation, e.g. ["Strix varia", "Gavia immer"]
dynamic_threshold = false       # after a clear detection, lower that species' threshold for a while
dynamic_threshold_trigger = 0.9 # confidence that counts as clear (must be above min_confidence)
dynamic_threshold_min = 0.2     # lowest threshold a species can reach
dynamic_threshold_hours = 24

[model]
dir = "/models"
kind = "birdnet-v2.4"                        # or "perch-v2" (see below and docs/MODEL.md)
classifier = "birdnet-v2.4-headless.onnx"   # see docs/MODEL.md
labels = "labels/en_us.txt"
meta_model = "meta-model.onnx"              # location/week filter; remove to disable
# species_list = "/config/species.txt"      # precomputed allowed list; overrides meta_model
threads = 0                                  # 0 = CPUs - 1
# Perch v2 instead (scripts/fetch-perch.sh): 5 s windows, softmax confidences, birds plus frogs,
# insects and mammals. BirdWeather uploads are turned off; recalibrate detection.min_confidence
# (softmax scores run lower). The location filter maps Perch species to BirdNET's by name.
# kind = "perch-v2"
# classifier = "perch/perch_v2_no_dft_fp32.onnx"
# labels = "perch/perch_v2_labels.txt"
# common_names = "labels/en_us.txt"          # BirdNET labels: common names and the location filter
# The BirdNET Geomodel (scripts/fetch-geomodel.sh) filters birds and other animals by location and
# names them; recommended with Perch:
# meta_model = "geomodel/BirdNET+_Geomodel_V3.0.4_Global_14K_FP32.onnx"
# meta_model_labels = "geomodel/BirdNET+_Geomodel_V3.0.4_Global_14K_Labels.txt"
# location_filter_unmapped = "allow"         # Perch species BirdNET does not know: "allow" or "block"

[storage]
data_dir = "/data"
clip_seconds = 6.0              # BirdNET-Pi EXTRACTION_LENGTH; centred on the 3 s window
clip_format = "flac"            # "flac" (lossless, about half the size) or "wav"
spectrograms = true

[retention]
clip_max_age_days = 14              # rolling window for saved clips
clip_max_total_mb = 4096            # delete oldest clips beyond this (0 = unlimited)
keep_best_per_species_per_day = 1   # exempt from purging (0 = none)
detection_rows_max_age_days = 0     # 0 = keep detection rows forever
purge_interval_minutes = 30

[birdweather]
token = ""                      # BirdWeather station token; empty disables uploads (needs station latitude/longitude)

[server]
bind = "0.0.0.0:8080"
cors_allow_origins = ["*"]
